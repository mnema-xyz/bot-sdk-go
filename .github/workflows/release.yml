name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # A manual run on a tag does the same (for a tag push that started no run).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag's ancestry is checked against main

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::run this on a tag vX.Y.Z, not $GITHUB_REF"; exit 1 ;; esac
          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "::error::Tag $GITHUB_REF_NAME is not on branch main"
            exit 1
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "::error::No changelog section found for $version in CHANGELOG.md"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes "$notes"

      - name: Warm Go module proxy
        run: |
          set -euo pipefail
          url="https://proxy.golang.org/github.com/mnema-xyz/bot-sdk-go/@v/$GITHUB_REF_NAME.info"
          warmed=false
          for i in 1 2 3 4 5; do
            if curl -fsS "$url" >/dev/null 2>&1; then
              warmed=true
              echo "Module proxy warmed on attempt $i"
              break
            fi
            sleep 5
          done
          if [ "$warmed" != "true" ]; then
            echo "::warning::Could not warm Go module proxy for $GITHUB_REF_NAME within 5 attempts"
          fi
